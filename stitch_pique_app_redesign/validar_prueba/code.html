<img class="w-full h-full rounded-full object-cover" data-alt="A professional close-up portrait of a young athletic user for a social gaming profile. The lighting is dramatic and cyberpunk-inspired with neon violet highlights against a dark background. The user has a focused, competitive expression, fitting the high-energy atmosphere of the app. High-end digital photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBD820RITaIBunHxIZPIQanG3nCJIft0KtYR9_IyhVQavkJreaOQsvoqJuFgu2aXmt8Jh871vSyPnP9kQfw7NTRK7Mko1J3Pnbr7xsu7XDkEcBLvYw81-Yw_37qeo_SvzVRdqTrlc5QV_Zq5Q9CPXXh8zjHNcbwz1f9FfREik46LXXZGdAFzrfT-u31CcJrnR_RtUUPiIWphJZt-UXSmDbmSY4QDCqmbdXksK4uoE9emZC86tBEE0QiUg"/>

</div>
<div class="absolute -bottom-1 -right-1 bg-secondary text-surface px-1.5 py-0.5 rounded-full">
<span class="material-symbols-outlined text-[14px] font-bold">bolt</span>
</div>
</div>
<div>

</div>

<p class="font-body-md text-body-md text-on-surface-variant">Reto: 5km Run</p>

</div>

<!-- Bottom Interaction Zone (Floating validation buttons) -->
<div class="fixed bottom-0 left-0 w-full px-container-margin pb-10 pt-4 bg-gradient-to-t from-background via-background/95 to-transparent z-40">
<div class="flex gap-4 max-w-md mx-auto">
<!-- Reject Button -->
<button class="flex-1 h-14 rounded-2xl bg-surface-container-high border border-tertiary/30 text-tertiary font-headline-sm flex items-center justify-center gap-2 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined">close</span>
                Rechazar
            </button>
<!-- Validate Button -->
<button class="flex-[1.5] h-14 rounded-2xl bg-secondary text-surface font-headline-sm flex items-center justify-center gap-2 shadow-[0_0_30px_rgba(188,255,95,0.2)] active:scale-95 btn-glow-success transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Validar
            </button>
</div>
</div>
<!-- Hidden Logic for micro-interactions -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Simple validation feedback animation simulation
        const validateBtn = document.querySelector('button.bg-secondary');
        validateBtn.addEventListener('click', () => {
            validateBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Validando...';
            setTimeout(() => {
                validateBtn.innerHTML = '<span class="material-symbols-outlined">verified</span> ¡Hecho!';
                validateBtn.classList.remove('bg-secondary');
                validateBtn.classList.add('bg-primary-container', 'text-white');
            }, 1000);
        });
    </script>

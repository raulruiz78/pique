<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pique - Configuración de Ritmo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Sora:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(26, 26, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 1);
        }
        input:focus, select:focus {
            outline: none;
            border-color: #d2bbff !important;
            box-shadow: 0 0 0 2px rgba(210, 187, 255, 0.2);
        }
        .day-selector input:checked + label {
            background-color: #d2bbff;
            color: #25005a;
            transform: scale(1.1);
        }
        .step-progress {
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#d2bbff",
                        "primary": "#d2bbff",
                        "primary-fixed-dim": "#d2bbff",
                        "on-secondary-fixed": "#112000",
                        "secondary-fixed": "#a8f928",
                        "inverse-surface": "#e5e2e1",
                        "on-background": "#e5e2e1",
                        "on-surface": "#e5e2e1",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#7c3aed",
                        "tertiary-container": "#b9383c",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "secondary-fixed-dim": "#8fdb00",
                        "on-tertiary-fixed": "#410006",
                        "surface": "#131313",
                        "inverse-primary": "#732ee4",
                        "surface-bright": "#3a3939",
                        "primary-fixed": "#eaddff",
                        "surface-dim": "#131313",
                        "surface-container": "#201f1f",
                        "on-primary": "#3f008e",
                        "on-primary-fixed-variant": "#5a00c6",
                        "inverse-on-surface": "#313030",
                        "outline": "#958da1",
                        "on-tertiary-fixed-variant": "#8c1520",
                        "secondary-container": "#95e400",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "on-tertiary": "#68000f",
                        "tertiary": "#ffb3b0",
                        "secondary": "#bcff5f",
                        "surface-variant": "#353534",
                        "on-surface-variant": "#ccc3d8",
                        "on-secondary-container": "#3d6200",
                        "on-error": "#690005",
                        "on-tertiary-container": "#ffdfdd",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary-fixed": "#ffdad8",
                        "on-secondary": "#203600",
                        "outline-variant": "#4a4455",
                        "on-primary-fixed": "#25005a",
                        "surface-container-highest": "#353534",
                        "on-secondary-fixed-variant": "#314f00",
                        "on-primary-container": "#ede0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "lg": "32px",
                        "md": "24px",
                        "xs": "4px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "xl": "48px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Sora"],
                        "stat-number": ["Sora"],
                        "headline-lg": ["Sora"],
                        "headline-sm": ["Sora"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "stat-number": ["28px", {"lineHeight": "1", "fontWeight": "800"}],
                        "headline-lg": ["32px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "headline-sm": ["20px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md flex justify-between items-center px-container-margin py-sm">
<div class="flex items-center gap-base">
<span class="font-headline-sm text-headline-sm text-primary">PIQUE</span>
</div>
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A futuristic professional headshot of a person with neon purple lighting accents on their face, set against a dark, tech-oriented studio background. The style is clean, modern, and aligned with a gaming social app aesthetic, using high-contrast deep tones and electric violet glows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHvgz2iIrD9u4gKjppnMtf1GN3Uj8sP0d0IxbXR7t6q5dFSYohRzkDT67t-sveKVp9NWwSBAWYGrhcheS6HKH3B5xG_dKVurmln8RqQ8_wVyImNOwL3Mzl9LaczhBkPHC_va_bNYLr0A-H99Dkk-DvA_4lczXdOmMMvvMu-lce3yuvQ96FZ9kAxZV5wUcB1rKHjGujG7U6BZc2OqyEx9WMGKk6Wl9g-gNPClrzBA_mcEGykjrP_EWNMA"/>
</div>
</div>
</header>
<main class="pt-24 px-container-margin max-w-md mx-auto">
<!-- Progress Section -->
<div class="mb-lg">
<div class="flex justify-between items-end mb-xs">
<span class="font-label-caps text-label-caps text-primary uppercase">Paso 3 de 4</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">75% Completado</span>
</div>
<div class="h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="step-progress h-full bg-primary" style="width: 75%"></div>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-lg tracking-tight">Marca el terreno.</h1>
<div class="space-y-md">
<!-- Date Range Bento -->
<div class="grid grid-cols-2 gap-gutter">
<div class="glass-card p-md rounded-[24px]">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-base uppercase">Empieza</label>
<input class="w-full bg-transparent border-none p-0 text-primary font-bold text-lg focus:ring-0" type="date" value="2023-10-27"/>
</div>
<div class="glass-card p-md rounded-[24px]">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-base uppercase">Termina</label>
<input class="w-full bg-transparent border-none p-0 text-primary font-bold text-lg focus:ring-0" type="date" value="2023-11-27"/>
</div>
</div>
<!-- Weekly Rhythm -->
<div class="glass-card p-md rounded-[24px]">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-md uppercase">Ritmo Semanal</label>
<div class="flex flex-col gap-sm">
<label class="flex items-center gap-md p-sm rounded-xl border border-outline-variant/30 hover:border-primary/50 transition-all cursor-pointer group">
<input checked="" class="text-primary focus:ring-primary bg-surface border-outline-variant" name="rhythm" type="radio" value="fixed"/>
<div>
<p class="font-bold">Días fijos</p>
<p class="text-xs text-on-surface-variant">Entrena siempre los mismos días.</p>
</div>
</label>
<label class="flex items-center gap-md p-sm rounded-xl border border-outline-variant/30 hover:border-primary/50 transition-all cursor-pointer group">
<input class="text-primary focus:ring-primary bg-surface border-outline-variant" name="rhythm" type="radio" value="flexible"/>
<div>
<p class="font-bold">Flexible</p>
<p class="text-xs text-on-surface-variant">Tú eliges cuándo, solo cumple el total.</p>
</div>
</label>
<label class="flex items-center gap-md p-sm rounded-xl border border-outline-variant/30 hover:border-primary/50 transition-all cursor-pointer group">
<input class="text-primary focus:ring-primary bg-surface border-outline-variant" name="rhythm" type="radio" value="multiple"/>
<div>
<p class="font-bold">Varias al día</p>
<p class="text-xs text-on-surface-variant">Para los que van a por todas.</p>
</div>
</label>
</div>
</div>
<!-- Day Selector -->
<div class="glass-card p-md rounded-[24px]">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-md uppercase">Días de Actividad</label>
<div class="flex justify-between gap-xs day-selector">
<div class="relative">
<input checked="" class="hidden" id="d-l" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-l">L</label>
</div>
<div class="relative">
<input checked="" class="hidden" id="d-m" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-m">M</label>
</div>
<div class="relative">
<input checked="" class="hidden" id="d-x" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-x">X</label>
</div>
<div class="relative">
<input checked="" class="hidden" id="d-j" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-j">J</label>
</div>
<div class="relative">
<input checked="" class="hidden" id="d-v" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-v">V</label>
</div>
<div class="relative">
<input class="hidden" id="d-s" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-s">S</label>
</div>
<div class="relative">
<input class="hidden" id="d-d" type="checkbox"/>
<label class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant text-xs font-bold transition-all cursor-pointer" for="d-d">D</label>
</div>
</div>
</div>
<!-- Points & Photo Toggle -->
<div class="grid grid-cols-1 gap-gutter">
<div class="glass-card p-md rounded-[24px] flex items-center justify-between">
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-xs uppercase">Puntos por check-in</label>
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-secondary">stars</span>
<input class="w-16 bg-transparent border-none p-0 text-headline-sm font-bold focus:ring-0" type="number" value="10"/>
</div>
</div>
<div class="h-12 w-1 bg-outline-variant/30"></div>
<div class="flex flex-col items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-xs uppercase">Foto Obligatoria</label>
<button class="w-12 h-6 bg-surface-container-highest rounded-full p-1 transition-colors relative" id="photoToggle" onclick="toggleSwitch(this)">
<div class="dot w-4 h-4 bg-on-surface-variant rounded-full transition-transform"></div>
</button>
</div>
</div>
</div>
<!-- Validation Method -->
<div class="glass-card p-md rounded-[24px]">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-md uppercase">Método de Validación</label>
<select class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-sm text-on-surface appearance-none cursor-pointer">
<option>La revisa el rival</option>
<option>Validación por GPS</option>
<option>Confianza mutua</option>
<option>IA de comprobación</option>
</select>
</div>
</div>
</main>
<!-- Navigation Buttons -->
<footer class="fixed bottom-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent pt-lg">
<div class="flex gap-gutter max-w-md mx-auto">
<button class="flex-1 h-14 rounded-full border border-outline-variant font-bold text-on-surface hover:bg-surface-container transition-colors flex items-center justify-center gap-base active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
                Atrás
            </button>
<button class="flex-[2] h-14 rounded-full bg-primary text-on-primary-fixed font-bold shadow-[0_0_20px_rgba(210,187,255,0.4)] hover:opacity-90 transition-all flex items-center justify-center gap-base active:scale-95 duration-200">
                Siguiente
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<script>
        function toggleSwitch(btn) {
            const dot = btn.querySelector('.dot');
            const isEnabled = btn.classList.contains('bg-primary');
            
            if (isEnabled) {
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-surface-container-highest');
                dot.classList.remove('translate-x-6', 'bg-on-primary-fixed');
                dot.classList.add('bg-on-surface-variant');
            } else {
                btn.classList.add('bg-primary');
                btn.classList.remove('bg-surface-container-highest');
                dot.classList.add('translate-x-6', 'bg-on-primary-fixed');
                dot.classList.remove('bg-on-surface-variant');
            }
        }

        // Add a subtle particle background or shader feel
        const main = document.querySelector('main');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 10;
            const y = (e.clientY / window.innerHeight) * 10;
            main.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        });
    </script>
</body></html>

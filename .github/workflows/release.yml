name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica sin v (por ejemplo, 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate semantic version and source version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const version = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Versión semántica inválida");
            const root = require("./package.json").version;
            const web = require("./apps/web/package.json").version;
            if (root !== version || web !== version) throw new Error(`La versión solicitada (${version}) no coincide con package.json (${root}/${web})`);
          '
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "La etiqueta v${RELEASE_VERSION} ya existe"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --title "Pique v${RELEASE_VERSION}" --generate-notes
